name: Deploy Mini App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build web
        env:
          # GitHub Pages отдаёт сайт из подпапки репозитория.
          VITE_BASE: /zayush-pdd/
          # Адрес backend (Render/Fly/…). Задайте в Settings → Variables: MINI_APP_API_BASE
          VITE_API_BASE: ${{ vars.MINI_APP_API_BASE }}
        run: npm run build -w @zayush/web

      - name: SPA fallback for client-side routing
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4